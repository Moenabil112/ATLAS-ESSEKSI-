<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/brand/atlas-isseksi-stacked.svg" />
    <meta
      name="description"
      content="ATLAS Isseksi ProjectCo — Confidential capital architecture window. Controlled distribution only."
    />
    <title>ATLAS Isseksi ProjectCo — Executive Deal Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Raleway:wght@300;400;500;600&family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the persisted language direction before first paint to avoid an LTR flash.
      (function () {
        try {
          var lang = localStorage.getItem("atlas-isseksi-language");
          if (lang) {
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
